[package]
name = "eigenon"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "eigenon"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
ndarray = "0.17.2"
num-complex = "0.4.6"
rand = "0.10.0"

[[bench]]
name = "sim_bench"
harness = false

[[bench]]
name = "gate_bench"
harness = false

[[bench]]
name = "cnot_bench"
harness = false

[dev-dependencies]
insta = "1.48.0"
