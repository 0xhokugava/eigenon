name: Rust

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - name: Check lints
        run: cargo clippy --all-targets --all-features -- -D warnings

  documentation:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Check documentation
        run: cargo doc --no-deps --all-features

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build
        run: cargo build --verbose

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Run tests
        run: cargo test --verbose

  qiskit-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: validation/qiskit/requirements.txt
      - name: Install Qiskit validation dependencies
        run: python -m pip install --requirement validation/qiskit/requirements.txt
      - name: Run Qiskit validation tests
        run: cargo test qiskit_ -- --ignored

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"
      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check advisories bans licenses sources

  # Keep the pre-existing required check name while making it an aggregate of
  # every stable CI job. The ruleset can safely require the individual checks
  # after this workflow has produced their exact names at least once.
  build:
    if: ${{ always() }}
    needs:
      - format
      - clippy
      - documentation
      - compile
      - test
      - qiskit-validation
      - dependency-policy
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all required jobs succeeded
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          COMPILE_RESULT: ${{ needs.compile.result }}
          TEST_RESULT: ${{ needs.test.result }}
          QISKIT_RESULT: ${{ needs.qiskit-validation.result }}
          DEPENDENCY_POLICY_RESULT: ${{ needs.dependency-policy.result }}
        run: |
          for result in \
            "$FORMAT_RESULT" \
            "$CLIPPY_RESULT" \
            "$DOCUMENTATION_RESULT" \
            "$COMPILE_RESULT" \
            "$TEST_RESULT" \
            "$QISKIT_RESULT" \
            "$DEPENDENCY_POLICY_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              exit 1
            fi
          done
